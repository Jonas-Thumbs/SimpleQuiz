<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <marker id="open-arrow-state" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#253858" stroke-width="1.5"/>
    </marker>
    <marker id="hollow-triangle-state" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#ffffff" stroke="#253858" stroke-width="1.5"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #253858; stroke-width: 2; }
      .header { fill: #e9f2ff; stroke: #253858; stroke-width: 2; }
      .title { font: bold 20px Arial, sans-serif; fill: #172b4d; text-anchor: middle; }
      .stereotype { font: italic 16px Arial, sans-serif; fill: #42526e; text-anchor: middle; }
      .member { font: 17px Arial, sans-serif; fill: #172b4d; }
      .role { font: bold 17px Arial, sans-serif; fill: #0052cc; text-anchor: middle; }
      .relation { fill: none; stroke: #253858; stroke-width: 2; }
      .realization { fill: none; stroke: #253858; stroke-width: 2; stroke-dasharray: 9 7; }
      .transition { fill: none; stroke: #00875a; stroke-width: 2; marker-end: url(#open-arrow-state); }
      .label { font: 16px Arial, sans-serif; fill: #42526e; }
      .transition-label { font: bold 16px Arial, sans-serif; fill: #006644; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#f7f9fc"/>
  <text x="600" y="28" class="role">State Pattern: Quiz Attempt Lifecycle</text>

  <rect x="410" y="55" width="390" height="175" rx="4" class="box"/>
  <rect x="410" y="55" width="390" height="82" rx="4" class="header"/>
  <text x="605" y="83" class="stereotype">&lt;&lt;interface&gt;&gt;</text>
  <text x="605" y="112" class="title">AttemptState</text>
  <line x1="410" y1="137" x2="800" y2="137" class="relation"/>
  <text x="430" y="168" class="member">+ ensure_can_save_answer(): void</text>
  <text x="430" y="201" class="member">+ submit(context, score): bool</text>

  <rect x="30" y="300" width="350" height="220" rx="4" class="box"/>
  <rect x="30" y="300" width="350" height="58" rx="4" class="header"/>
  <text x="205" y="337" class="title">QuizAttemptContext</text>
  <line x1="30" y1="358" x2="380" y2="358" class="relation"/>
  <text x="50" y="390" class="member">- attempt: QuizAttempt</text>
  <text x="50" y="422" class="member">- state: AttemptState</text>
  <text x="50" y="454" class="member">+ ensure_can_save_answer(): void</text>
  <text x="50" y="486" class="member">+ submit(score): bool</text>
  <text x="205" y="547" class="role">Context</text>

  <rect x="455" y="335" width="310" height="150" rx="4" class="box"/>
  <rect x="455" y="335" width="310" height="58" rx="4" class="header"/>
  <text x="610" y="372" class="title">InProgressState</text>
  <line x1="455" y1="393" x2="765" y2="393" class="relation"/>
  <text x="470" y="426" class="member">+ ensure_can_save_answer()</text>
  <text x="470" y="458" class="member">+ submit(context, score)</text>
  <text x="610" y="510" class="role">ConcreteState</text>

  <rect x="845" y="335" width="310" height="150" rx="4" class="box"/>
  <rect x="845" y="335" width="310" height="58" rx="4" class="header"/>
  <text x="1000" y="372" class="title">SubmittedState</text>
  <line x1="845" y1="393" x2="1155" y2="393" class="relation"/>
  <text x="860" y="426" class="member">+ ensure_can_save_answer()</text>
  <text x="860" y="458" class="member">+ submit(context, score)</text>
  <text x="1000" y="510" class="role">ConcreteState</text>

  <path d="M380 385 C405 300, 440 245, 505 230" class="relation" marker-end="url(#open-arrow-state)"/>
  <text x="385" y="290" class="label">delegates to</text>
  <path d="M610 335 L610 230" class="realization" marker-end="url(#hollow-triangle-state)"/>
  <path d="M1000 335 C1000 275, 820 248, 710 230" class="realization" marker-end="url(#hollow-triangle-state)"/>
  <path d="M765 465 C795 535, 825 535, 855 465" class="transition"/>
  <text x="810" y="565" class="transition-label">submit()</text>

  <text x="600" y="598" class="stereotype">Submitting an in-progress attempt transitions the context to SubmittedState.</text>
</svg>
